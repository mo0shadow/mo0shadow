<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56">
  <defs>
    <linearGradient id="fadeL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B1020" stop-opacity="1"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="1"/>
    </linearGradient>
    <g id="row" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#DCE8FF" text-anchor="middle">
      <g transform="translate(10,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">REST APIs</text></g>
      <g transform="translate(170,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">Firebase Auth</text></g>
      <g transform="translate(330,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">Firestore</text></g>
      <g transform="translate(490,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">Push (FCM)</text></g>
      <g transform="translate(650,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">Payments</text></g>
      <g transform="translate(810,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">Google Maps</text></g>
      <g transform="translate(970,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">Social Login</text></g>
      <g transform="translate(1130,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">WebSockets</text></g>
      <g transform="translate(1290,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">Crashlytics</text></g>
      <g transform="translate(1450,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">Analytics</text></g>
      <g transform="translate(1610,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#4F8CFF"/><text x="72" y="22">AI / LLM APIs</text></g>
      <g transform="translate(1770,11)"><rect width="144" height="34" rx="17" fill="#1E1B4B" stroke="#8B5CF6"/><text x="72" y="22">Deep Links</text></g>
    </g>
  </defs>

  <rect width="900" height="56" rx="12" fill="#0B1020"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1920 0" dur="32s" repeatCount="indefinite"/>
    <use href="#row"/>
    <use href="#row" x="1920"/>
  </g>
  <rect width="70" height="56" fill="url(#fadeL)"/>
  <rect x="830" width="70" height="56" fill="url(#fadeR)"/>
  <rect x="0.5" y="0.5" width="899" height="55" rx="12" fill="none" stroke="#312E81"/>
</svg>
