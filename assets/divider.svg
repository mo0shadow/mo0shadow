<svg xmlns="http://www.w3.org/2000/svg" width="900" height="26" viewBox="0 0 900 26">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0"    stop-color="#38BDF8"/>
      <stop offset="0.35" stop-color="#6366F1"/>
      <stop offset="0.7"  stop-color="#8B5CF6"/>
      <stop offset="1"    stop-color="#C084FC"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="40"  y="12" width="370" height="2" rx="1" fill="url(#l)"/>
  <rect x="490" y="12" width="370" height="2" rx="1" fill="url(#l)"/>

  <g filter="url(#glow)">
    <g transform="translate(450,13)" fill="#A78BFA">
      <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z">
        <animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.6" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="425" cy="13" r="2" fill="#38BDF8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="475" cy="13" r="2" fill="#C084FC"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
